; Bai 1 - delay() / millis() / timer phan cung
;   pio run -e vd1_dung_delay -t upload
;   pio run -e vd2_non_blocking -t upload
;   pio run -e bai_tap -t upload      ; so sanh 3 cach, nut GPIO4 bat/tat "CPU ban"

[platformio]
default_envs = vd1_dung_delay, vd2_non_blocking, bai_tap

[env]
platform = espressif32@6.9.0   ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:vd1_dung_delay]
build_src_filter = -<*> +<vd1_dung_delay.cpp>

[env:vd2_non_blocking]
build_src_filter = -<*> +<vd2_non_blocking.cpp>

[env:bai_tap]
build_src_filter = -<*> +<bai_tap_so_sanh_3_cach.cpp>
