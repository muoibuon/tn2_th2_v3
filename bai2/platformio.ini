; Bai 2 - Deep sleep, RTC_DATA_ATTR, cac che do tiet kiem dien
;   pio run -e vd1_rtc_data_attr -t upload
;   pio run -e vd2_thuc_day_setup -t upload
;   pio run -e bai_tap -t upload        ; nut GPIO4: Active -> Modem -> Light -> Deep
;   pio run -e bai_tap_wokwi            ; ban cho Wokwi (Wi-Fi STA "Wokwi-GUEST")

[platformio]
default_envs = vd1_rtc_data_attr, vd2_thuc_day_setup, bai_tap

[env]
platform = espressif32@6.9.0   ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:vd1_rtc_data_attr]
build_src_filter = -<*> +<vd1_rtc_data_attr.cpp>

[env:vd2_thuc_day_setup]
build_src_filter = -<*> +<vd2_thuc_day_setup.cpp>

[env:bai_tap]
build_src_filter = -<*> +<bai_tap_che_do_nang_luong.cpp>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

[env:bai_tap_wokwi]
extends = env:bai_tap
build_flags = -DWOKWI
